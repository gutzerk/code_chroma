name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python engine + bridge
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: pipx install poetry==2.5.1

      - name: Cache the virtualenv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction

      # The bridge tests shell out to git, and `git commit` refuses to run without an identity.
      - name: Configure git identity
        run: |
          git config --global user.email ci@example.com
          git config --global user.name "CI"
          git config --global init.defaultBranch main

      - run: poetry run ruff check .

      - name: Typecheck (advisory until every module is annotated)
        run: poetry run mypy src/codechroma
        continue-on-error: true

      - name: Raise inotify limits for the per-workspace watchers
        run: |
          sudo sysctl -w fs.inotify.max_user_instances=8192 fs.inotify.max_user_watches=524288
          ulimit -n

      - run: poetry run pytest -n auto -q

  web:
    name: Web canvas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run lint

      # `npm run build` is `tsc -b && vite build`, so this is the typecheck too.
      - run: npm run build

      - run: npm test

  # Static checks for the install/release plumbing: shell installers, workflows.
  installers-lint:
    name: Lint installers and workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck the shell installers
        run: shellcheck --severity=warning distribution/install.sh distribution/velopack/pack.sh

      # -shellcheck= / -pyflakes= keep actionlint to workflow syntax and expression checks only.
      - name: actionlint the workflows
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color -shellcheck= -pyflakes=

  # install.ps1 is Windows-only code: lint it and run its Pester suite on a real Windows runner.
  installers-windows:
    name: PowerShell installer (Pester + PSScriptAnalyzer)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Pester 5 and PSScriptAnalyzer
        shell: pwsh
        run: |
          $modules = @(
            @{ Name = 'Pester'; MinimumVersion = '5.5.0'; SkipPublisherCheck = $true }
            @{ Name = 'PSScriptAnalyzer' }
          )
          foreach ($module in $modules) {
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                Install-Module @module -Force -Scope CurrentUser -ErrorAction Stop
                break
              } catch {
                if ($attempt -eq 3) { throw }
                Write-Warning "Installing $($module.Name) failed (attempt $attempt/3): $_. Retrying."
                Start-Sleep -Seconds (10 * $attempt)
              }
            }
          }

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $findings = foreach ($path in 'distribution', 'scripts') {
            Invoke-ScriptAnalyzer -Path $path -Recurse -Severity Error, Warning -ExcludeRule PSAvoidUsingWriteHost, PSUseShouldProcessForStateChangingFunctions
          }
          $findings | Format-Table RuleName, ScriptName, Line, Message -AutoSize
          if ($findings) { exit 1 }

      - name: Pester
        shell: pwsh
        run: Invoke-Pester -Path tests/pester -CI

  # The C# shell's tests, including the updater swap helpers (POSIX sh on Linux/macOS, PowerShell on
  # Windows) that can only be exercised on their own OS.
  dotnet-shell:
    name: C# shell tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Test CodeChroma.Shell
        run: dotnet test dotnet/CodeChroma.Shell.sln --configuration Release

  # The C# graph core (with its parity goldens), the bridge and the headless Avalonia canvas tests.
  dotnet-core:
    name: C# core, bridge and canvas tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Test CodeChroma.Core
        run: dotnet test dotnet/CodeChroma.sln --configuration Release

      - name: Test CodeChroma.Bridge
        run: dotnet test dotnet/CodeChroma.Bridge.sln --configuration Release

      - name: Test CodeChroma.Canvas
        run: dotnet test dotnet/CodeChroma.Canvas.sln --configuration Release
