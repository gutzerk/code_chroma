name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python engine + bridge
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: pipx install poetry==2.5.1

      - name: Cache the virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction

      # The bridge tests shell out to git, and `git commit` refuses to run without an identity.
      - name: Configure git identity
        run: |
          git config --global user.email ci@example.com
          git config --global user.name "CI"
          git config --global init.defaultBranch main

      - run: poetry run ruff check .

      - name: Typecheck (advisory until every module is annotated)
        run: poetry run mypy src/codechroma
        continue-on-error: true

      - run: poetry run pytest -q

  web:
    name: Web canvas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run lint

      # `npm run build` is `tsc -b && vite build`, so this is the typecheck too.
      - run: npm run build

      - run: npm test
