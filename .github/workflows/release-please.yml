name: Release

# Creates/updates a Release PR on every push to main (version bump + CHANGELOG via conventional
# commits). Merging that PR bumps the version, tags vX.Y.Z and drafts a GitHub Release; then
# build jobs (macOS arm64 and x64 / Windows x64 / Linux x64) assemble the desktop installers and
# upload them to it.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Rebuild installers and latest.json for an existing release tag
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  # attest-build-provenance needs these to sign each artifact with a short-lived OIDC identity.
  attestations: write
  id-token: write

# cancel-in-progress: false on purpose -- a release build (macOS installer takes 20-40 min) must
# never be killed by a later push to main; a fresh Release PR/diff landing mid-build should just
# wait its turn rather than aborting an upload mid-way.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version + CHANGELOG + Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name || github.event.inputs.release_tag }}
    steps:
      # The attestation identity the installers and the in-app updater pin is this workflow on main.
      - name: Refuse manual runs from branches other than main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Dispatch this workflow from main (got ${GITHUB_REF}): attestations are pinned to main, so a build from another branch would fail verification in every installer."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.code_pat_release }}
          manifest-file: .release-please-manifest.json
          config-file: release-please-config.json
      - name: Keep an existing release unpublished during recovery
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: gh release edit "$RELEASE_TAG" --draft

  # Holds the platform builds until ci.yml is green for this commit, so a red main never ships.
  gate:
    name: Wait for green CI
    runs-on: ubuntu-latest
    needs: release
    if: >-
      ${{ needs.release.outputs.release_created == 'true' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '') }}
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for the CI workflow on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 100); do
            runs="$(gh run list --repo "$REPO" --workflow ci.yml --commit "$SHA" --json status,conclusion)"
            total="$(jq 'length' <<<"$runs")"
            passed="$(jq '[.[] | select(.conclusion == "success")] | length' <<<"$runs")"
            pending="$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")"
            if [ "$passed" -gt 0 ]; then echo "CI is green for $SHA."; exit 0; fi
            if [ "$total" -gt 0 ] && [ "$pending" -eq 0 ]; then
              echo "::error::CI did not pass for $SHA; refusing to build the release."
              exit 1
            fi
            echo "waiting for CI on $SHA (attempt $attempt, runs: $total, pending: $pending)"
            sleep 30
          done
          echo "::error::Timed out waiting for CI on $SHA."
          exit 1

  # The installers share the same three stages as scripts/dev/build_desktop.sh:
  # web SPA bundle (same-origin) -> PyInstaller-frozen bridge -> electron-builder.
  macos:
    name: Build macOS installer (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-14
            bridge_arch: arm64
          - arch: x64
            runner: macos-15-intel
            bridge_arch: x86_64
    runs-on: ${{ matrix.runner }}
    needs: [release, gate]
    if: >-
      ${{ needs.release.outputs.release_created == 'true' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '') }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # One setup-node per npm project so each gets its own cache key from its own lockfile.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Poetry
        run: pipx install poetry==2.5.1

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Install Python deps
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction

      - name: Generate app icon
        run: poetry run python scripts/make_desktop_icon.py

      - name: Build canvas bundle (same-origin)
        env:
          VITE_ENGINE_BRIDGE_URL: same-origin
          VITE_TERMINAL_BRIDGE_URL: same-origin
        run: npm --prefix web run build

      - name: Freeze the bridge (PyInstaller)
        env:
          CODECHROMA_PYINSTALLER_TARGET_ARCH: ${{ matrix.bridge_arch }}
        run: poetry run pyinstaller packaging/bridge.spec --noconfirm --clean

      # Signing hook: a no-op until the MAC_* secrets exist. Signing/notarizing also needs
      # `identity: null` removed and a notarize block in desktop/electron-builder.yml.
      - name: Enable macOS signing and notarization when secrets are configured
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          MAC_APPLE_ID: ${{ secrets.MAC_APPLE_ID }}
          MAC_APPLE_APP_PASSWORD: ${{ secrets.MAC_APPLE_APP_PASSWORD }}
          MAC_APPLE_TEAM_ID: ${{ secrets.MAC_APPLE_TEAM_ID }}
        run: |
          if [ -n "$MAC_CSC_LINK" ]; then
            {
              echo "CSC_LINK=$MAC_CSC_LINK"
              echo "CSC_KEY_PASSWORD=$MAC_CSC_KEY_PASSWORD"
              echo "APPLE_ID=$MAC_APPLE_ID"
              echo "APPLE_APP_SPECIFIC_PASSWORD=$MAC_APPLE_APP_PASSWORD"
              echo "APPLE_TEAM_ID=$MAC_APPLE_TEAM_ID"
            } >> "$GITHUB_ENV"
            echo "macOS signing enabled."
          else
            echo "No macOS signing secrets configured; building unsigned."
          fi

      - name: Package the Electron app (dmg)
        run: npm --prefix desktop run dist -- --${{ matrix.arch }}

      # Publish a SHA-256 sidecar for the dmg so both the in-app updater and install_desktop.sh can
      # verify the download before it's mounted or copied into /Applications.
      - name: Hash the DMG
        run: |
          shopt -s nullglob
          installers=(desktop/dist/CodeChroma-*-${{ matrix.arch }}.dmg)
          if (( ${#installers[@]} != 1 )); then
            echo "Expected exactly one ${{ matrix.arch }} DMG, found ${#installers[@]}." >&2
            exit 1
          fi
          shasum -a 256 "${installers[0]}" > "${installers[0]}.sha256"

      # Signs the dmg with a short-lived OIDC identity (Sigstore/attestations) so the in-app updater
      # can verify provenance against GitHub Actions instead of trusting the release's own sidecar.
      - name: Attest the DMG
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: desktop/dist/CodeChroma-*-${{ matrix.arch }}.dmg

      # Keep the release as a draft until all platforms and latest.json are ready. Glob files are
      # expanded by the action itself (not the shell), so a missing match is a visible error.
      - name: Upload DMG to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.release.outputs.tag_name }}
          draft: true
          files: |
            desktop/dist/CodeChroma-*-${{ matrix.arch }}.dmg
            desktop/dist/CodeChroma-*-${{ matrix.arch }}.dmg.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    name: Build Windows installer (x64)
    runs-on: windows-latest
    needs: [release, gate]
    if: >-
      ${{ needs.release.outputs.release_created == 'true' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '') }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Poetry
        run: pipx install poetry==2.5.1

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Install Python deps
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction

      - name: Build canvas bundle (same-origin)
        env:
          VITE_ENGINE_BRIDGE_URL: same-origin
          VITE_TERMINAL_BRIDGE_URL: same-origin
        run: npm --prefix web run build

      - name: Freeze the bridge (PyInstaller)
        run: poetry run pyinstaller packaging/bridge.spec --noconfirm --clean

      # Signing hook: a no-op until the WIN_* secrets exist. Authenticode also needs a
      # win.signtoolOptions block in desktop/electron-builder.yml.
      - name: Enable Windows Authenticode signing when secrets are configured
        shell: pwsh
        env:
          WIN_CSC_LINK_SECRET: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD_SECRET: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if (-not [string]::IsNullOrEmpty($env:WIN_CSC_LINK_SECRET)) {
            "WIN_CSC_LINK=$env:WIN_CSC_LINK_SECRET" | Add-Content -Path $env:GITHUB_ENV
            "WIN_CSC_KEY_PASSWORD=$env:WIN_CSC_KEY_PASSWORD_SECRET" | Add-Content -Path $env:GITHUB_ENV
            Write-Host 'Windows signing enabled.'
          } else {
            Write-Host 'No Windows signing secrets configured; building unsigned.'
          }

      - name: Package the Electron app (nsis)
        run: npm --prefix desktop run dist

      # Versioned name (CodeChroma-<version>-x64-Setup.exe); the manifest records the exact asset URL.
      - name: Hash the Setup.exe
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path "desktop/dist/CodeChroma-*-x64-Setup.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Setup.exe, found $($installers.Count)."
          }
          $installer = $installers[0]
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content "$($installer.FullName).sha256"

      # Signs the Setup.exe with a short-lived OIDC identity for the in-app updater's provenance check.
      - name: Attest the Setup.exe
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: desktop/dist/CodeChroma-*-x64-Setup.exe

      - name: Upload Setup to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.release.outputs.tag_name }}
          draft: true
          files: |
            desktop/dist/CodeChroma-*-x64-Setup.exe
            desktop/dist/CodeChroma-*-x64-Setup.exe.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux:
    name: Build Linux installers (x64)
    runs-on: ubuntu-22.04
    needs: [release, gate]
    if: >-
      ${{ needs.release.outputs.release_created == 'true' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '') }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Poetry
        run: pipx install poetry==2.5.1

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Install Python deps
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction

      # setup-python above already puts 3.14 on PATH; the venv poetry builds uses it directly,
      # so no system-python bootstrap is needed here (as on the macos/windows jobs).
      - name: Build canvas bundle (same-origin)
        env:
          VITE_ENGINE_BRIDGE_URL: same-origin
          VITE_TERMINAL_BRIDGE_URL: same-origin
        run: npm --prefix web run build

      - name: Freeze the bridge (PyInstaller)
        run: poetry run pyinstaller packaging/bridge.spec --noconfirm --clean

      - name: Package the Electron app (deb + AppImage)
        run: npm --prefix desktop run dist

      # SHA-256 sidecars for the deb and AppImage, verified by install_linux.sh (and the in-app
      # updater for the AppImage) before install.
      - name: Hash the Linux installers
        run: |
          shopt -s nullglob
          debs=(desktop/dist/CodeChroma-*-x64.deb)
          appimages=(desktop/dist/CodeChroma-*-x64.AppImage)
          if (( ${#debs[@]} != 1 )); then
            echo "Expected exactly one x64 deb, found ${#debs[@]}." >&2
            exit 1
          fi
          if (( ${#appimages[@]} != 1 )); then
            echo "Expected exactly one x64 AppImage, found ${#appimages[@]}." >&2
            exit 1
          fi
          for installer in "${debs[@]}" "${appimages[@]}"; do
            sha256sum "$installer" > "$installer.sha256"
          done

      # Sign both Linux installers with a short-lived OIDC identity for provenance verification; each
      # matched file gets its own attestation.
      - name: Attest the Linux installers
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            desktop/dist/CodeChroma-*-x64.deb
            desktop/dist/CodeChroma-*-x64.AppImage

      - name: Upload installers to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.release.outputs.tag_name }}
          draft: true
          files: |
            desktop/dist/CodeChroma-*-x64.deb
            desktop/dist/CodeChroma-*-x64.AppImage
            desktop/dist/CodeChroma-*-x64.deb.sha256
            desktop/dist/CodeChroma-*-x64.AppImage.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ---------------------------------------------------------------------------------------------
  # C# app (016-remove-electron, Phase 2): .NET publish + Velopack packaging next to the Electron
  # jobs above. Off by default: they only run when the repository variable CODECROMA_BUILD_DOTNET
  # is 'true', and the assets are named so installed Electron updaters never select them. These
  # packages are verified by SHA-256 only in the app (no Sigstore, no certificates); the sidecar and
  # the manifest are the whole trust. Layout contract with the shell: the frozen bridge ships in
  # <app dir>/bridge/codechroma-bridge/, mirroring the Electron resources layout.
  # ---------------------------------------------------------------------------------------------
  dotnet-windows:
    name: Build C# app (win-x64, Velopack)
    runs-on: windows-latest
    needs: [release, gate]
    if: >-
      ${{ vars.CODECROMA_BUILD_DOTNET == 'true' &&
          (needs.release.outputs.release_created == 'true' ||
           (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')) }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Build canvas bundle (same-origin)
        env:
          VITE_ENGINE_BRIDGE_URL: same-origin
          VITE_TERMINAL_BRIDGE_URL: same-origin
        run: npm --prefix web run build

      - name: Resolve the release version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^([A-Za-z0-9._-]+-)?v(\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?)$') {
            throw "Unexpected release tag format: $env:RELEASE_TAG"
          }
          "version=$($Matches[2])" | Add-Content -Path $env:GITHUB_OUTPUT

      - name: Publish the shell (self-contained)
        shell: pwsh
        run: |
          dotnet publish dotnet/CodeChroma.Shell.App -c Release -r win-x64 --self-contained true -p:Version=${{ steps.version.outputs.version }} -p:BundleCSharpBridge=true -o publish

      - name: Install Velopack CLI
        run: dotnet tool install --global vpk --version 1.2.161

      - name: Pack (Setup + update zip, checksums)
        shell: pwsh
        run: ./distribution/velopack/pack.ps1 -Version ${{ steps.version.outputs.version }} -PublishDir publish -OutDir dist-dotnet

      # Provenance for `gh attestation verify` in the shell installers; the in-app updater does not use it.
      - name: Attest the packages
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist-dotnet/CodeChroma-*-win-x64-Installer.exe
            dist-dotnet/CodeChroma-*-win-x64.zip

      - name: Upload packages to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.release.outputs.tag_name }}
          draft: true
          files: |
            dist-dotnet/CodeChroma-*-win-x64-Installer.exe
            dist-dotnet/CodeChroma-*-win-x64.zip
            dist-dotnet/CodeChroma-*-win-x64-Installer.exe.sha256
            dist-dotnet/CodeChroma-*-win-x64.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dotnet-macos:
    name: Build C# app (${{ matrix.rid }}, Velopack)
    strategy:
      matrix:
        include:
          - rid: osx-arm64
            runner: macos-14
            bridge_arch: arm64
          - rid: osx-x64
            runner: macos-15-intel
            bridge_arch: x86_64
    runs-on: ${{ matrix.runner }}
    needs: [release, gate]
    if: >-
      ${{ vars.CODECROMA_BUILD_DOTNET == 'true' &&
          (needs.release.outputs.release_created == 'true' ||
           (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')) }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Build canvas bundle (same-origin)
        env:
          VITE_ENGINE_BRIDGE_URL: same-origin
          VITE_TERMINAL_BRIDGE_URL: same-origin
        run: npm --prefix web run build

      - name: Resolve the release version
        id: version
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
        run: |
          pattern='^([A-Za-z0-9._-]+-)?v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$'
          if [[ ! "$RELEASE_TAG" =~ $pattern ]]; then
            echo "::error::Unexpected release tag format: $RELEASE_TAG"
            exit 1
          fi
          echo "version=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"

      - name: Publish the shell (self-contained)
        run: |
          dotnet publish dotnet/CodeChroma.Shell.App -c Release -r ${{ matrix.rid }} --self-contained true -p:Version=${{ steps.version.outputs.version }} -p:BundleCSharpBridge=true -o publish

      - name: Install Velopack CLI
        run: dotnet tool install --global vpk --version 1.2.161

      - name: Pack (app bundle zip, checksum)
        run: sh distribution/velopack/pack.sh ${{ matrix.rid }} ${{ steps.version.outputs.version }} publish dist-dotnet

      - name: Attest the package
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist-dotnet/CodeChroma-*-${{ matrix.rid }}.zip

      - name: Upload package to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.release.outputs.tag_name }}
          draft: true
          files: |
            dist-dotnet/CodeChroma-*-${{ matrix.rid }}.zip
            dist-dotnet/CodeChroma-*-${{ matrix.rid }}.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dotnet-linux:
    name: Build C# app (linux-x64, Velopack AppImage)
    runs-on: ubuntu-22.04
    needs: [release, gate]
    if: >-
      ${{ vars.CODECROMA_BUILD_DOTNET == 'true' &&
          (needs.release.outputs.release_created == 'true' ||
           (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')) }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Build canvas bundle (same-origin)
        env:
          VITE_ENGINE_BRIDGE_URL: same-origin
          VITE_TERMINAL_BRIDGE_URL: same-origin
        run: npm --prefix web run build

      - name: Resolve the release version
        id: version
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
        run: |
          pattern='^([A-Za-z0-9._-]+-)?v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$'
          if [[ ! "$RELEASE_TAG" =~ $pattern ]]; then
            echo "::error::Unexpected release tag format: $RELEASE_TAG"
            exit 1
          fi
          echo "version=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"

      - name: Publish the shell (self-contained)
        run: |
          dotnet publish dotnet/CodeChroma.Shell.App -c Release -r linux-x64 --self-contained true -p:Version=${{ steps.version.outputs.version }} -p:BundleCSharpBridge=true -o publish

      - name: Install Velopack CLI
        run: dotnet tool install --global vpk --version 1.2.161

      - name: Pack (AppImage, checksum)
        run: sh distribution/velopack/pack.sh linux-x64 ${{ steps.version.outputs.version }} publish dist-dotnet

      - name: Attest the AppImage
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist-dotnet/CodeChroma-*-linux-x86_64.AppImage

      - name: Upload AppImage to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.release.outputs.tag_name }}
          draft: true
          files: |
            dist-dotnet/CodeChroma-*-linux-x86_64.AppImage
            dist-dotnet/CodeChroma-*-linux-x86_64.AppImage.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Assembles and publishes distribution/latest.json -- the single install manifest that
  # distribution/install.{sh,ps1} read. It runs after the macOS, Windows, and Linux build jobs
  # complete and their .sha256 sidecars are uploaded, builds the manifest with the one generator
  # (scripts/gen_distribution_manifest.py), attests it, and publishes it to the Release (reachable
  # at .../releases/latest/download/latest.json) together with the version-pinned installer scripts.
  manifest:
    name: Publish install manifest (latest.json)
    runs-on: ubuntu-latest
    # The optional dotnet-* jobs may be skipped (CODECROMA_BUILD_DOTNET off); a skipped need must not skip the manifest.
    needs: [release, macos, windows, linux, dotnet-windows, dotnet-macos, dotnet-linux]
    if: >-
      ${{ !cancelled() && !failure() &&
          (needs.release.outputs.release_created == 'true' ||
           (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download installer checksums and asset sizes from the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
        run: |
          mkdir -p distribution/sidecars
          gh release download "$RELEASE_TAG" --pattern '*.sha256' --dir distribution/sidecars
          gh release view "$RELEASE_TAG" --json assets > distribution/assets.json
      - name: Build latest.json
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
          REPO: ${{ github.repository }}
          MIN_SUPPORTED_VERSION: ${{ vars.CODECROMA_MIN_SUPPORTED_VERSION || '0.0.0' }}
        run: |
          pattern='^([A-Za-z0-9._-]+-)?v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$'
          if [[ ! "$RELEASE_TAG" =~ $pattern ]]; then
            echo "::error::Unexpected release tag format: $RELEASE_TAG"
            exit 1
          fi
          python3 scripts/gen_distribution_manifest.py "${BASH_REMATCH[2]}" \
            --build-dir distribution/sidecars --sidecars distribution/sidecars \
            --assets-json distribution/assets.json --tag "$RELEASE_TAG" --repo "$REPO" \
            --min-supported-version "$MIN_SUPPORTED_VERSION"
          echo "=== latest.json ==="
          cat distribution/latest.json
      # Attests the manifest and the sidecars so `gh attestation verify` can vouch for them too.
      - name: Attest the manifest and checksum sidecars
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            distribution/latest.json
            distribution/sidecars/*.sha256
      # Version-pinned copies of the installer scripts: use .../releases/download/vX.Y.Z/install.sh
      # to run the code of one release instead of whatever is on main.
      - name: Upload manifest and installer scripts to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.release.outputs.tag_name }}
          draft: false
          files: |
            distribution/latest.json
            distribution/install.sh
            distribution/install.ps1
            distribution/install.cmd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Opens an issue when a platform build or the manifest failed: the release stays a draft and
  # /releases/latest keeps pointing at the previous version, which is easy to miss.
  alert:
    name: Alert on an incomplete release
    runs-on: ubuntu-latest
    needs: [release, gate, macos, windows, linux, dotnet-windows, dotnet-macos, dotnet-linux, manifest]
    if: ${{ failure() && needs.release.outputs.tag_name != '' }}
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open an issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "$REPO" \
            --title "Release $RELEASE_TAG is incomplete" \
            --body "A job in the release workflow failed, so $RELEASE_TAG is still a draft and users keep getting the previous version. Fix the failure, then re-run the failed jobs or dispatch the Release workflow on main with release_tag=$RELEASE_TAG. Run: $RUN_URL"
