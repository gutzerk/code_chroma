name: Release

# Creates/updates a Release PR on every push to main (version bump + CHANGELOG via conventional
# commits). Merging that PR bumps the version, tags vX.Y.Z and drafts a GitHub Release; then
# build jobs (macOS arm64 and x64 / Windows x64 / Linux x64) assemble the desktop installers and
# upload them to it.
on:
  push:
    branches: [main]
  workflow_dispatch: # manual "release now" button

permissions:
  contents: write
  pull-requests: write
  # attest-build-provenance needs these to sign each artifact with a short-lived OIDC identity.
  attestations: write
  id-token: write

# cancel-in-progress: false on purpose -- a release build (macOS installer takes 20-40 min) must
# never be killed by a later push to main; a fresh Release PR/diff landing mid-build should just
# wait its turn rather than aborting an upload mid-way.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version + CHANGELOG + Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: release
        uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4
        with:
          token: ${{ secrets.code_pat_release }}
          manifest-file: .release-please-manifest.json
          config-file: release-please-config.json

  # The installers share the same three stages as scripts/dev/build_desktop.sh:
  # web SPA bundle (same-origin) -> PyInstaller-frozen bridge -> electron-builder.
  macos:
    name: Build macOS installer (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-14
            bridge_arch: arm64
          - arch: x64
            runner: macos-15-intel
            bridge_arch: x86_64
    runs-on: ${{ matrix.runner }}
    needs: release
    if: needs.release.outputs.release_created == 'true'
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      # One setup-node per npm project so each gets its own cache key from its own lockfile.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Poetry
        run: pipx install poetry==2.5.1

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Install Python deps
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction

      - name: Generate app icon
        run: poetry run python scripts/make_desktop_icon.py

      - name: Build canvas bundle (same-origin)
        env:
          VITE_ENGINE_BRIDGE_URL: same-origin
          VITE_TERMINAL_BRIDGE_URL: same-origin
        run: npm --prefix web run build

      - name: Freeze the bridge (PyInstaller)
        env:
          CODECHROMA_PYINSTALLER_TARGET_ARCH: ${{ matrix.bridge_arch }}
        run: poetry run pyinstaller packaging/bridge.spec --noconfirm --clean

      - name: Package the Electron app (dmg)
        run: npm --prefix desktop run dist -- --${{ matrix.arch }}

      # Publish a SHA-256 sidecar for the dmg so both the in-app updater and install_desktop.sh can
      # verify the download before it's mounted or copied into /Applications.
      - name: Hash the DMG
        run: |
          shopt -s nullglob
          installers=(desktop/dist/CodeChroma-*-${{ matrix.arch }}.dmg)
          if (( ${#installers[@]} != 1 )); then
            echo "Expected exactly one ${{ matrix.arch }} DMG, found ${#installers[@]}." >&2
            exit 1
          fi
          shasum -a 256 "${installers[0]}" > "${installers[0]}.sha256"

      # Signs the dmg with a short-lived OIDC identity (Sigstore/attestations) so the in-app updater
      # can verify provenance against GitHub Actions instead of trusting the release's own sidecar.
      - name: Attest the DMG
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: desktop/dist/CodeChroma-*-${{ matrix.arch }}.dmg

      # softprops/action-gh-release appends assets to the tag/Release release-please already made;
      # glob files are expanded by the action itself (not the shell), so a missing match is a
      # visible error, never a silent no-op.
      - name: Upload DMG to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.release.outputs.tag_name }}
          files: |
            desktop/dist/CodeChroma-*-${{ matrix.arch }}.dmg
            desktop/dist/CodeChroma-*-${{ matrix.arch }}.dmg.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    name: Build Windows installer (x64)
    runs-on: windows-latest
    needs: release
    if: needs.release.outputs.release_created == 'true'
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Poetry
        run: pipx install poetry==2.5.1

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Install Python deps
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction

      - name: Build canvas bundle (same-origin)
        env:
          VITE_ENGINE_BRIDGE_URL: same-origin
          VITE_TERMINAL_BRIDGE_URL: same-origin
        run: npm --prefix web run build

      - name: Freeze the bridge (PyInstaller)
        run: poetry run pyinstaller packaging/bridge.spec --noconfirm --clean

      - name: Package the Electron app (nsis)
        run: npm --prefix desktop run dist

      # SHA-256 sidecar for the Setup.exe, verified by install_desktop.ps1 before it's launched.
      - name: Hash the Setup.exe
        shell: pwsh
        run: Get-FileHash desktop/dist/CodeChroma-*-Setup.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLowerInvariant())  $($_.Path | Split-Path -Leaf)" } | Set-Content desktop/dist/CodeChroma-*-Setup.exe.sha256

      # Signs the Setup.exe with a short-lived OIDC identity for the in-app updater's provenance check.
      - name: Attest the Setup.exe
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: desktop/dist/CodeChroma-*-Setup.exe

      - name: Upload Setup to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.release.outputs.tag_name }}
          files: |
            desktop/dist/CodeChroma-*-Setup.exe
            desktop/dist/CodeChroma-*-Setup.exe.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux:
    name: Build Linux installers (x64)
    runs-on: ubuntu-22.04
    needs: release
    if: needs.release.outputs.release_created == 'true'
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Poetry
        run: pipx install poetry==2.5.1

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Install Python deps
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction

      # setup-python above already puts 3.14 on PATH; the venv poetry builds uses it directly,
      # so no system-python bootstrap is needed here (as on the macos/windows jobs).
      - name: Build canvas bundle (same-origin)
        env:
          VITE_ENGINE_BRIDGE_URL: same-origin
          VITE_TERMINAL_BRIDGE_URL: same-origin
        run: npm --prefix web run build

      - name: Freeze the bridge (PyInstaller)
        run: poetry run pyinstaller packaging/bridge.spec --noconfirm --clean

      - name: Package the Electron app (deb + AppImage)
        run: npm --prefix desktop run dist

      # SHA-256 sidecars for the deb and AppImage, verified by install_linux.sh (and the in-app
      # updater for the AppImage) before install.
      - name: Hash the Linux installers
        run: |
          sha256sum desktop/dist/CodeChroma-*-x64.deb > desktop/dist/CodeChroma-*-x64.deb.sha256
          sha256sum desktop/dist/CodeChroma-*-x64.AppImage > desktop/dist/CodeChroma-*-x64.AppImage.sha256

      # Sign both Linux installers with a short-lived OIDC identity for provenance verification; each
      # matched file gets its own attestation.
      - name: Attest the Linux installers
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            desktop/dist/CodeChroma-*-x64.deb
            desktop/dist/CodeChroma-*-x64.AppImage

      - name: Upload installers to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.release.outputs.tag_name }}
          files: |
            desktop/dist/CodeChroma-*-x64.deb
            desktop/dist/CodeChroma-*-x64.AppImage
            desktop/dist/CodeChroma-*-x64.deb.sha256
            desktop/dist/CodeChroma-*-x64.AppImage.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Assembles and publishes distribution/latest.json -- the single install manifest that
  # distribution/install.sh (macOS/Linux) and install.ps1 (Windows) read. It runs after the macOS,
  # Windows, and Linux build jobs complete and their .sha256 sidecars are uploaded, then publishes
  # the manifest to that Release so it's reachable at .../releases/latest/download/latest.json.
  # Asset URLs and checksums are deterministic from the tag + released sidecars.
  manifest:
    name: Publish install manifest (latest.json)
    runs-on: ubuntu-latest
    needs: [release, macos, windows, linux]
    if: needs.release.outputs.release_created == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and upload latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, re, time, urllib.error, urllib.request

          repo, tag = os.environ["REPO"], os.environ["RELEASE_TAG"]
          match = re.fullmatch(
              r"(?:[A-Za-z0-9._-]+-)?v(?P<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)",
              tag,
          )
          if not match:
              raise SystemExit(f"Unexpected release tag format: {tag!r}")
          version = match.group("version")
          base = f"https://github.com/{repo}/releases/download/{tag}"
          targets = ["macos-arm64", "macos-x64", "windows-x64", "linux-x64", "linux-appimage"]
          names = {
              "macos-arm64":   f"CodeChroma-{version}-arm64.dmg",
              "macos-x64":     f"CodeChroma-{version}-x64.dmg",
              "windows-x64":   f"CodeChroma-{version}-Setup.exe",
              "linux-x64":     f"CodeChroma-{version}-x64.deb",
              "linux-appimage":f"CodeChroma-{version}-x64.AppImage",
          }
          assets, sha = {}, {}
          for t in targets:
              n = names[t]
              # fetch the released .sha256 sidecar (first token, e.g. "<hex>  <name>")
              sidecar_url = f"{base}/{n}.sha256"
              for attempt in range(6):
                  try:
                      with urllib.request.urlopen(sidecar_url, timeout=30) as r:
                          digest = r.read().decode().strip().split()[0].lower()
                      break
                  except urllib.error.HTTPError as error:
                      if error.code not in (404, 429, 500, 502, 503, 504) or attempt == 5:
                          raise
                      delay = 2 ** attempt
                      print(f"Retrying {sidecar_url} after HTTP {error.code} in {delay}s.")
                      time.sleep(delay)
              assets[t] = f"{base}/{n}"
              sha[t] = digest
          manifest = {"version": version, "assets": assets, "sha256": sha}
          os.makedirs("distribution", exist_ok=True)
          with open("distribution/latest.json", "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PY
          echo "=== latest.json ==="
          cat distribution/latest.json
      - name: Upload manifest to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.release.outputs.tag_name }}
          files: distribution/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
