name: Release

# Creates/updates a Release PR on every push to main (version bump + CHANGELOG via conventional
# commits). Merging that PR bumps the version, tags vX.Y.Z and drafts a GitHub Release; then
# build jobs (macOS arm64 and x64 / Windows x64 / Linux x64) assemble the desktop installers and
# upload them to it.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Rebuild installers and latest.json for an existing release tag
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  # attest-build-provenance needs these to sign each artifact with a short-lived OIDC identity.
  attestations: write
  id-token: write

# cancel-in-progress: false on purpose -- a release build (macOS installer takes 20-40 min) must
# never be killed by a later push to main; a fresh Release PR/diff landing mid-build should just
# wait its turn rather than aborting an upload mid-way.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version + CHANGELOG + Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name || github.event.inputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          token: ${{ secrets.code_pat_release }}
          manifest-file: .release-please-manifest.json
          config-file: release-please-config.json
      - name: Keep an existing release unpublished during recovery
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: gh release edit "$RELEASE_TAG" --draft

  # The installers share the same three stages as scripts/dev/build_desktop.sh:
  # web SPA bundle (same-origin) -> PyInstaller-frozen bridge -> electron-builder.
  macos:
    name: Build macOS installer (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-14
            bridge_arch: arm64
          - arch: x64
            runner: macos-15-intel
            bridge_arch: x86_64
    runs-on: ${{ matrix.runner }}
    needs: release
    if: >-
      ${{ needs.release.outputs.release_created == 'true' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '') }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # One setup-node per npm project so each gets its own cache key from its own lockfile.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Poetry
        run: pipx install poetry==2.5.1

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Install Python deps
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction

      - name: Generate app icon
        run: poetry run python scripts/make_desktop_icon.py

      - name: Build canvas bundle (same-origin)
        env:
          VITE_ENGINE_BRIDGE_URL: same-origin
          VITE_TERMINAL_BRIDGE_URL: same-origin
        run: npm --prefix web run build

      - name: Freeze the bridge (PyInstaller)
        env:
          CODECHROMA_PYINSTALLER_TARGET_ARCH: ${{ matrix.bridge_arch }}
        run: poetry run pyinstaller packaging/bridge.spec --noconfirm --clean

      - name: Package the Electron app (dmg)
        run: npm --prefix desktop run dist -- --${{ matrix.arch }}

      # Publish a SHA-256 sidecar for the dmg so both the in-app updater and install_desktop.sh can
      # verify the download before it's mounted or copied into /Applications.
      - name: Hash the DMG
        run: |
          shopt -s nullglob
          installers=(desktop/dist/CodeChroma-*-${{ matrix.arch }}.dmg)
          if (( ${#installers[@]} != 1 )); then
            echo "Expected exactly one ${{ matrix.arch }} DMG, found ${#installers[@]}." >&2
            exit 1
          fi
          shasum -a 256 "${installers[0]}" > "${installers[0]}.sha256"

      # Signs the dmg with a short-lived OIDC identity (Sigstore/attestations) so the in-app updater
      # can verify provenance against GitHub Actions instead of trusting the release's own sidecar.
      - name: Attest the DMG
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: desktop/dist/CodeChroma-*-${{ matrix.arch }}.dmg

      # Keep the release as a draft until all platforms and latest.json are ready. Glob files are
      # expanded by the action itself (not the shell), so a missing match is a visible error.
      - name: Upload DMG to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.release.outputs.tag_name }}
          draft: true
          files: |
            desktop/dist/CodeChroma-*-${{ matrix.arch }}.dmg
            desktop/dist/CodeChroma-*-${{ matrix.arch }}.dmg.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    name: Build Windows installer (x64)
    runs-on: windows-latest
    needs: release
    if: >-
      ${{ needs.release.outputs.release_created == 'true' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '') }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Poetry
        run: pipx install poetry==2.5.1

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Install Python deps
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction

      - name: Build canvas bundle (same-origin)
        env:
          VITE_ENGINE_BRIDGE_URL: same-origin
          VITE_TERMINAL_BRIDGE_URL: same-origin
        run: npm --prefix web run build

      - name: Freeze the bridge (PyInstaller)
        run: poetry run pyinstaller packaging/bridge.spec --noconfirm --clean

      - name: Package the Electron app (nsis)
        run: npm --prefix desktop run dist

      # Stable names are used by the Windows bootstrapper and GitHub's latest/download endpoint.
      - name: Hash the Setup.exe
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path "desktop/dist/CodeChroma-Setup.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Setup.exe, found $($installers.Count)."
          }
          $installer = $installers[0]
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content "$($installer.FullName).sha256"

      # Signs the Setup.exe with a short-lived OIDC identity for the in-app updater's provenance check.
      - name: Attest the Setup.exe
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: desktop/dist/CodeChroma-Setup.exe

      - name: Upload Setup to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.release.outputs.tag_name }}
          draft: true
          files: |
            desktop/dist/CodeChroma-Setup.exe
            desktop/dist/CodeChroma-Setup.exe.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux:
    name: Build Linux installers (x64)
    runs-on: ubuntu-22.04
    needs: release
    if: >-
      ${{ needs.release.outputs.release_created == 'true' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '') }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Poetry
        run: pipx install poetry==2.5.1

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Install Python deps
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction

      # setup-python above already puts 3.14 on PATH; the venv poetry builds uses it directly,
      # so no system-python bootstrap is needed here (as on the macos/windows jobs).
      - name: Build canvas bundle (same-origin)
        env:
          VITE_ENGINE_BRIDGE_URL: same-origin
          VITE_TERMINAL_BRIDGE_URL: same-origin
        run: npm --prefix web run build

      - name: Freeze the bridge (PyInstaller)
        run: poetry run pyinstaller packaging/bridge.spec --noconfirm --clean

      - name: Package the Electron app (deb + AppImage)
        run: npm --prefix desktop run dist

      # SHA-256 sidecars for the deb and AppImage, verified by install_linux.sh (and the in-app
      # updater for the AppImage) before install.
      - name: Hash the Linux installers
        run: |
          shopt -s nullglob
          debs=(desktop/dist/CodeChroma-*-x64.deb)
          appimages=(desktop/dist/CodeChroma-*-x64.AppImage)
          if (( ${#debs[@]} != 1 )); then
            echo "Expected exactly one x64 deb, found ${#debs[@]}." >&2
            exit 1
          fi
          if (( ${#appimages[@]} != 1 )); then
            echo "Expected exactly one x64 AppImage, found ${#appimages[@]}." >&2
            exit 1
          fi
          for installer in "${debs[@]}" "${appimages[@]}"; do
            sha256sum "$installer" > "$installer.sha256"
          done

      # Sign both Linux installers with a short-lived OIDC identity for provenance verification; each
      # matched file gets its own attestation.
      - name: Attest the Linux installers
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            desktop/dist/CodeChroma-*-x64.deb
            desktop/dist/CodeChroma-*-x64.AppImage

      - name: Upload installers to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.release.outputs.tag_name }}
          draft: true
          files: |
            desktop/dist/CodeChroma-*-x64.deb
            desktop/dist/CodeChroma-*-x64.AppImage
            desktop/dist/CodeChroma-*-x64.deb.sha256
            desktop/dist/CodeChroma-*-x64.AppImage.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Assembles and publishes distribution/latest.json -- the single install manifest that
  # distribution/install.sh (macOS/Linux) reads. It runs after the macOS, Windows, and Linux build
  # jobs complete and their .sha256 sidecars are uploaded, then publishes the manifest to that
  # Release so it's reachable at .../releases/latest/download/latest.json.
  # Asset URLs and checksums are deterministic from the tag + released sidecars.
  manifest:
    name: Publish install manifest (latest.json)
    runs-on: ubuntu-latest
    needs: [release, macos, windows, linux]
    if: >-
      ${{ needs.release.outputs.release_created == 'true' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download installer checksums from the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
        run: |
          mkdir -p distribution/sidecars
          gh release download "$RELEASE_TAG" --pattern '*.sha256' --dir distribution/sidecars
      - name: Build and upload latest.json
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          repo, tag = os.environ["REPO"], os.environ["RELEASE_TAG"]
          match = re.fullmatch(
              r"(?:[A-Za-z0-9._-]+-)?v(?P<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)",
              tag,
          )
          if not match:
              raise SystemExit(f"Unexpected release tag format: {tag!r}")
          version = match.group("version")
          base = f"https://github.com/{repo}/releases/download/{tag}"
          targets = ["macos-arm64", "macos-x64", "windows-x64", "linux-x64", "linux-appimage"]
          names = {
              "macos-arm64":   f"CodeChroma-{version}-arm64.dmg",
              "macos-x64":     f"CodeChroma-{version}-x64.dmg",
              "windows-x64":   "CodeChroma-Setup.exe",
              "linux-x64":     f"CodeChroma-{version}-x64.deb",
              "linux-appimage":f"CodeChroma-{version}-x64.AppImage",
          }
          assets, sha = {}, {}
          for t in targets:
              n = names[t]
              sidecar = Path("distribution/sidecars") / f"{n}.sha256"
              digest = sidecar.read_text().strip().split()[0].lower()
              if not re.fullmatch(r"[0-9a-f]{64}", digest):
                  raise SystemExit(f"Invalid SHA-256 sidecar for {n}: {digest!r}")
              if t == "windows-x64":
                  assets[t] = f"https://github.com/{repo}/releases/latest/download/{n}"
              else:
                  assets[t] = f"{base}/{n}"
              sha[t] = digest
          manifest = {"version": version, "assets": assets, "sha256": sha}
          os.makedirs("distribution", exist_ok=True)
          with open("distribution/latest.json", "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PY
          echo "=== latest.json ==="
          cat distribution/latest.json
      - name: Upload manifest to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.release.outputs.tag_name }}
          draft: false
          files: distribution/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
