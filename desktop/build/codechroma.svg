<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2018"/>
      <stop offset="100%" stop-color="#04120C"/>
    </linearGradient>
    <linearGradient id="fileFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E4A32"/>
      <stop offset="100%" stop-color="#123A26"/>
    </linearGradient>
    <linearGradient id="nodeFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7CFFB2"/>
      <stop offset="100%" stop-color="#2FB673"/>
    </linearGradient>
    <linearGradient id="diag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#33E88F" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5CFFAA" stop-opacity="1"/>
      <stop offset="100%" stop-color="#33E88F" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="512" height="512" rx="104" fill="url(#bg)"/>
  <clipPath id="clip"><rect x="0" y="0" width="512" height="512" rx="104"/></clipPath>

  <g clip-path="url(#clip)">
    <!-- LEFT: structured file stack (complexity, but organized) -->
    <rect x="80" y="150" width="108" height="132" rx="14" fill="url(#fileFill)" opacity="0.6"/>
    <rect x="96" y="184" width="108" height="132" rx="14" fill="url(#fileFill)" opacity="0.8"/>
    <rect x="112" y="218" width="108" height="132" rx="14" fill="url(#fileFill)" stroke="#3EDB8D" stroke-width="3"/>

    <!-- code lines on front file -->
    <g stroke-linecap="round">
      <line x1="130" y1="252" x2="170" y2="252" stroke="#5CFFAA" stroke-width="7"/>
      <line x1="130" y1="270" x2="192" y2="270" stroke="#8FB9A2" stroke-width="7"/>
      <line x1="130" y1="288" x2="180" y2="288" stroke="#8FB9A2" stroke-width="7"/>
      <line x1="130" y1="306" x2="200" y2="306" stroke="#8FB9A2" stroke-width="7"/>
      <line x1="130" y1="324" x2="164" y2="324" stroke="#5CFFAA" stroke-width="7"/>
    </g>

    <!-- diagonal divider -->
    <line x1="230" y1="0" x2="330" y2="512" stroke="url(#diag)" stroke-width="10"/>

    <!-- RIGHT: simple network diagram -->
    <line x1="392" y1="256" x2="392" y2="166" stroke="#2FB673" stroke-width="10" stroke-linecap="round"/>
    <line x1="392" y1="256" x2="392" y2="346" stroke="#2FB673" stroke-width="10" stroke-linecap="round"/>
    <line x1="392" y1="256" x2="462" y2="256" stroke="#2FB673" stroke-width="10" stroke-linecap="round"/>

    <rect x="438" y="232" width="48" height="48" rx="12" fill="url(#nodeFill)"/>
    <rect x="368" y="142" width="48" height="48" rx="12" fill="url(#nodeFill)"/>
    <rect x="368" y="322" width="48" height="48" rx="12" fill="url(#nodeFill)"/>

    <circle cx="392" cy="256" r="34" fill="#123A26" stroke="url(#nodeFill)" stroke-width="8"/>
  </g>
</svg>
