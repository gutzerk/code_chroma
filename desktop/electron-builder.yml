appId: com.codechroma.desktop
productName: CodeChroma
directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - launcher/**/*
  - tabbar/**/*
  - package.json

# The PyInstaller one-dir bundle, kept outside the asar so its executable stays executable.
extraResources:
  - from: ../dist/codechroma-bridge
    to: bridge/codechroma-bridge

mac:
  target:
    - target: dmg
  artifactName: CodeChroma-${version}-${arch}.${ext}
  category: public.app-category.developer-tools
  # Unsigned by design for now -- recipients right-click -> Open on first launch. To sign later,
  # drop these two lines and supply CSC_LINK / CSC_KEY_PASSWORD plus a notarize block.
  identity: null

dmg:
  title: CodeChroma

win:
  target:
    - nsis
  artifactName: CodeChroma-${version}-Setup.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - target: deb
      arch: [x64]
    - target: AppImage
      arch: [x64]
  # Unsigned by design -- the .deb/.AppImage install fine, Ubuntu just shows the standard
  # "unverified publisher" prompt. Signing would need a paid OSS Maintainer key.
  # Note: keep ${arch} literal as "x64" -- electron-builder's built-in arch mapping would emit
  # "amd64" (deb) / "x86_64" (AppImage), which breaks the release-please.yml glob and the
  # install_linux.sh asset filter, both of which match "-x64".
  category: Development
  artifactName: CodeChroma-${version}-x64.${ext}
