<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self' file:"
    />
    <title>CodeChroma</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #11131a;
        --panel: #191d28;
        --line: #2a3040;
        --text: #e6e9f0;
        --muted: #8b93a7;
        --accent: #6c8cff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-user-select: none;
      }
      h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .subtitle {
        margin: -18px 0 0;
        color: var(--muted);
      }
      .panel {
        width: 460px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel);
        overflow: hidden;
      }
      .panel-title {
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
        color: var(--muted);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .recent {
        display: block;
        width: 100%;
        padding: 11px 14px;
        border: 0;
        border-bottom: 1px solid var(--line);
        background: transparent;
        color: var(--text);
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .recent:disabled,
      button.primary:disabled {
        color: var(--muted);
        cursor: default;
        opacity: 0.55;
      }
      .recent:disabled:hover,
      button.primary:disabled:hover {
        background: transparent;
        filter: none;
      }
      .recent-entry:last-child > .recent {
        border-bottom: 0;
      }
      .recent:hover {
        background: #212736;
      }
      .recent .path {
        display: block;
        color: var(--muted);
        font-size: 11px;
        margin-top: 2px;
      }
      .recent-workspaces {
        background: #141722;
      }
      .recent-workspaces:empty {
        display: none;
      }
      .recent.workspace {
        padding-left: 28px;
        font-size: 12px;
        border-bottom: 1px solid var(--line);
      }
      .recent-workspaces .recent.workspace:last-child {
        border-bottom: 0;
      }
      .empty {
        padding: 16px 14px;
        color: var(--muted);
      }
      button.primary {
        padding: 9px 18px;
        border: 1px solid var(--accent);
        border-radius: 7px;
        background: var(--accent);
        color: #0b0e16;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button.primary:hover {
        filter: brightness(1.08);
      }
      #status {
        min-height: 34px;
        width: 460px;
        text-align: center;
        color: var(--muted);
        white-space: pre-wrap;
      }
      #status.error {
        color: #ff8b8b;
        text-align: left;
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 11px;
      }
      .new-project {
        width: 460px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .new-project input {
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--panel);
        color: var(--text);
        font: inherit;
      }
      .new-project .row {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .new-project .row span {
        flex: 1;
        color: var(--muted);
        font-size: 11px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      button.secondary {
        padding: 9px 18px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: transparent;
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }
      button.secondary:disabled {
        opacity: 0.55;
        cursor: default;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <h1>CodeChroma</h1>
    <p class="subtitle">Open a repository to map it.</p>

    <div class="panel" id="recents-panel">
      <div class="panel-title">Recent</div>
      <div id="recents"></div>
    </div>

    <div class="row" style="display: flex; gap: 8px">
      <button class="primary" id="open">Open folder…</button>
      <button class="secondary" id="new-toggle">New project…</button>
    </div>

    <form class="new-project hidden" id="new-form">
      <input id="new-name" placeholder="Project name" autocomplete="off" />
      <div class="row">
        <button type="button" class="secondary" id="new-browse">Location…</button>
        <span id="new-location">No location chosen</span>
      </div>
      <button type="submit" class="primary" id="new-create">Create and open</button>
    </form>
    <div id="status"></div>

    <script type="module" src="./launcher.js"></script>
  </body>
</html>
